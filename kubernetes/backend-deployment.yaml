apiVersion: apps/v1
kind: Deployment
metadata:
  name: marketflow-backend
  labels:
    app: backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
      - name: backend
        image: my-registry/marketflow-backend:latest
        ports:
        - containerPort: 8000
        env:
        - name: DB_HOST
          value: "postgres-service"
        - name: DB_NAME
          value: "store"
        - name: DB_USER
          value: "postgres"
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: marketflow-secrets
              key: DB_PASSWORD
        - name: SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: marketflow-secrets
              key: DJANGO_SECRET_KEY
        - name: REDIS_URL
          value: "redis://redis-service:6379/0"
        - name: CELERY_BROKER_URL
          value: "redis://redis-service:6379/0"
        - name: CHANNEL_LAYER_REDIS_URL
          value: "redis://redis-service:6379/1"
        - name: DEBUG
          value: "False"
        - name: ALLOWED_HOSTS
          value: ".marketflow.kz"
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
        readinessProbe:
          httpGet:
            path: /api/products/
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /api/products/
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 30
